<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Hisar{% endblock %}</title>
  <meta name="description" content="{% block description %}End-to-end encrypted password, SSH key and secrets manager for developers.{% endblock %}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  {% include "partials/header.html" %}
  <main id="content" class="{% block main_class %}site-main{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% include "partials/footer.html" %}
</body>
</html>
